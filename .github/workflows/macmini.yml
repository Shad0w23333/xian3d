name: Mac mini CI
'on':
  push:
    branches:
    - '**'
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
concurrency:
  group: macmini-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -e -o pipefail {0}
jobs:
  check:
    name: Build and checks on Mac mini
    runs-on:
    - self-hosted
    - macOS
    - ARM64
    - macmini
    timeout-minutes: 120
    steps:
    - name: Check this is still the latest eligible commit
      run: python3 /Users/Shared/macmini-ci/bin/check_fresh.py
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/checkout@v4
      if: ${{ env.MACMINI_FRESH == 'true' }}
    - if: ${{ env.MACMINI_FRESH == 'true' }}
      name: Use SSD Python 3.12
      run: bash /Users/Shared/macmini-ci/bin/setup-python.sh 3.12
    - name: Project build and checks
      run: bash .github/scripts/macmini-build.sh
      if: ${{ env.MACMINI_FRESH == 'true' }}
    - name: Collect CI outputs
      if: ${{ always() && env.MACMINI_FRESH == 'true' }}
      run: python3 /Users/Shared/macmini-ci/bin/collect-artifacts.py
    - name: Collect standalone offline build
      if: ${{ success() && env.MACMINI_FRESH == 'true' }}
      run: python3 .github/scripts/collect-standalone.py
    - name: Upload CI outputs
      if: ${{ always() && env.MACMINI_FRESH == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: macmini-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-artifacts/
        retention-days: 7
        if-no-files-found: error
    if: ${{ (github.actor == github.repository_owner) && github.triggering_actor == github.repository_owner && (github.event_name
      == 'push' || github.event_name == 'workflow_dispatch') }}
